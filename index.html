<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vid Call</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#home{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.home-box{
  width:100%;
  max-width:430px;
}
.logo{
  text-align:center;
  font-size:30px;
  font-weight:700;
  margin-bottom:35px;
}
.home-card{
  background:#111;
  border:1px solid #292929;
  border-radius:22px;
  padding:28px 22px;
}
.home-card h1{
  text-align:center;
  font-size:25px;
  margin-bottom:10px;
}
.home-card p{
  text-align:center;
  color:#999;
  font-size:14px;
  line-height:1.5;
  margin-bottom:24px;
}
.primary,.secondary{
  width:100%;
  padding:15px;
  border-radius:13px;
  font-weight:600;
}
.primary{
  background:#fff;
  color:#000;
  border:0;
}
.secondary{
  background:#202020;
  color:#fff;
  border:1px solid #333;
}
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#666;
  margin:20px 0;
}
.divider:before,.divider:after{
  content:"";
  height:1px;
  background:#292929;
  flex:1;
}
.room-input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #333;
  background:#080808;
  color:#fff;
  text-align:center;
  outline:none;
  margin-bottom:11px;
}
#callScreen{
  min-height:100vh;
  background:#000;
  position:relative;
}
.call-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:65px;
  padding:0 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
  z-index:20;
}
.call-title{font-weight:600}
.room-code{font-size:12px;color:#888;margin-top:3px}
.header-buttons{
  display:flex;
  gap:7px;
}
.small-button{
  background:#191919;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  padding:9px 12px;
}
.video-area{
  min-height:100vh;
  padding:74px 8px 95px;
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.video-box{
  position:relative;
  min-height:300px;
  overflow:hidden;
  border-radius:17px;
  background:#111;
  border:1px solid #222;
}
video{
  width:100%;
  height:100%;
  min-height:300px;
  object-fit:cover;
  background:#111;
}
.avatar{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  z-index:2;
}
.video-name{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:6px 9px;
  border-radius:8px;
  background:rgba(0,0,0,.55);
  font-size:12px;
  z-index:5;
}
.jautua{
  position:absolute;
  right:10px;
  bottom:10px;
  font-size:8px;
  color:rgba(255,255,255,.55);
  z-index:6;
}
.call-controls{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:9px;
  padding:9px;
  border-radius:18px;
  background:rgba(20,20,20,.92);
  border:1px solid #292929;
  z-index:30;
}
.control{
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid #333;
  background:#222;
  color:#fff;
  font-size:18px;
}
.control.active{
  background:#fff;
  color:#000;
}
.end-call{
  background:#a90020;
  border-color:#a90020;
}
.effects-button{
  position:fixed;
  right:15px;
  bottom:83px;
  z-index:30;
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:12px;
  padding:10px 13px;
}
.effects-panel{
  position:fixed;
  right:15px;
  bottom:137px;
  width:min(350px,calc(100vw - 30px));
  max-height:67vh;
  overflow:auto;
  background:#111;
  border:1px solid #303030;
  border-radius:18px;
  padding:17px;
  z-index:40;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}
.effects-panel h2{
  font-size:18px;
  margin-bottom:5px;
}
.description{
  color:#888;
  font-size:12px;
  line-height:1.4;
  margin-bottom:15px;
}
.effect-section{
  border-top:1px solid #292929;
  padding-top:15px;
  margin-top:15px;
}
.effect-section h3{
  font-size:14px;
  margin-bottom:10px;
}
.upload{
  display:block;
  width:100%;
  padding:12px;
  border:1px dashed #444;
  border-radius:10px;
  background:#181818;
  color:#aaa;
  text-align:center;
  cursor:pointer;
  margin-bottom:8px;
}
.upload input{display:none}
.effect-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.effect-item{
  width:100%;
  text-align:left;
  padding:11px;
  border-radius:10px;
  border:1px solid #292929;
  background:#1a1a1a;
  color:#fff;
}
.effect-item.selected{
  border-color:#fff;
}
.record-button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#202020;
  color:#fff;
}
.status{
  color:#777;
  font-size:11px;
  margin-top:7px;
}
.voice-preview{
  width:100%;
  margin-top:8px;
}
.clear-effect{
  margin-top:8px;
  width:100%;
  padding:10px;
  border-radius:10px;
  background:#191919;
  border:1px solid #333;
  color:#aaa;
}
@media(min-width:750px){
  .video-area{
    grid-template-columns:1fr 1fr;
  }
  .video-box{
    min-height:calc(100vh - 170px);
  }
  video{
    min-height:calc(100vh - 170px);
  }
}
</style>
</head>
<body>
<section id="home">
  <div class="home-box">
<div class="logo">Vid Call</div>
<div class="home-card">
  <h1>Start a video call</h1>
  <p>
    Create a room and share the call link with someone.
  </p>
  <button class="primary" id="createCall">
    Create Call
  </button>
  <div class="divider">
    <span>or</span>
  </div>
  <input
    class="room-input"
    id="roomInput"
    placeholder="Enter room code"
    autocomplete="off"
  >
  <button class="secondary" id="joinCall">
    Join Call
  </button>
</div>
  </div>
</section>
<section id="callScreen" class="hidden">
  <header class="call-header">
<div>
  <div class="call-title">Vid Call</div>
  <div class="room-code" id="displayRoom"></div>
</div>
<div class="header-buttons">
  <button class="small-button" id="shareButton">
    Share
  </button>
  <button class="small-button" id="copyButton">
    Copy
  </button>
</div>
  </header>
  <main class="video-area">
<div class="video-box">
  <video id="localVideo" autoplay muted playsinline></video>
  <img id="avatarImage" class="avatar" alt="Selected effect">
  <div class="video-name">You</div>
  <div class="jautua">
    • Ja?tua
  </div>
</div>
<div class="video-box">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="video-name">Guest</div>
  <div class="jautua">
    • Ja?tua
  </div>
</div>
  </main>
  <button class="effects-button" id="effectsButton">
    Effects
  </button>
  <aside class="effects-panel hidden" id="effectsPanel">
<h2>Effects</h2>
<p class="description">
  Choose a visual or audio effect for your own call preview.
</p>
<div class="effect-section">
  <h3>Picture effect</h3>
  <label class="upload">
    Upload Picture
    <input
      type="file"
      id="pictureUpload"
      accept="image/*"
    >
  </label>
  <div id="faceList" class="effect-list"></div>
  <button class="clear-effect" id="clearFace">
    Remove Picture Effect
  </button>
</div>
<div class="effect-section">
  <h3>Voice effect</h3>
  <div id="voiceList" class="effect-list">
    <button class="effect-item" data-voice="normal">
      Normal
    </button>
    <button class="effect-item" data-voice="deep">
      Deep
    </button>
    <button class="effect-item" data-voice="high">
      High
    </button>
    <button class="effect-item" data-voice="robot">
      Robot
    </button>
    <button class="effect-item" data-voice="echo">
      Echo
    </button>
    <button class="effect-item" data-voice="radio">
      Radio
    </button>
  </div>
  <label class="upload" style="margin-top:9px">
    Upload Audio
    <input
      type="file"
      id="audioUpload"
      accept="audio/*"
    >
  </label>
  <button class="record-button" id="recordVoice">
    Record Voice
  </button>
  <div class="status" id="recordStatus">
    Ready
  </div>
  <audio
    id="uploadedAudio"
    class="voice-preview hidden"
    controls
  ></audio>
</div>
  </aside>
  <div class="call-controls">
<button class="control active" id="micButton">
  🎙
</button>
<button class="control active" id="cameraButton">
  📹
</button>
<button class="control end-call" id="endCall">
  ☎
</button>
  </div>
</section>
<script>
/* =========================
   ELEMENTS
========================= */
const home =
  document.getElementById("home");
const callScreen =
  document.getElementById("callScreen");
const createCall =
  document.getElementById("createCall");
const joinCall =
  document.getElementById("joinCall");
const roomInput =
  document.getElementById("roomInput");
const displayRoom =
  document.getElementById("displayRoom");
const localVideo =
  document.getElementById("localVideo");
const remoteVideo =
  document.getElementById("remoteVideo");
const avatarImage =
  document.getElementById("avatarImage");
const micButton =
  document.getElementById("micButton");
const cameraButton =
  document.getElementById("cameraButton");
const endCall =
  document.getElementById("endCall");
const effectsButton =
  document.getElementById("effectsButton");
const effectsPanel =
  document.getElementById("effectsPanel");
const pictureUpload =
  document.getElementById("pictureUpload");
const faceList =
  document.getElementById("faceList");
const clearFace =
  document.getElementById("clearFace");
const audioUpload =
  document.getElementById("audioUpload");
const uploadedAudio =
  document.getElementById("uploadedAudio");
const recordVoice =
  document.getElementById("recordVoice");
const recordStatus =
  document.getElementById("recordStatus");
let localStream = null;
let currentRoom = null;
let audioContext = null;
let sourceNode = null;
let effectDestination = null;
let currentVoiceEffect = "normal";
let recorder = null;
let recordedChunks = [];
/* =========================
   ROOM
========================= */
function generateRoomCode(){
  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let code = "";
  for(let i=0;i<8;i++){
    code +=
      chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}
function openCall(room){
  currentRoom = room;
  home.classList.add("hidden");
  callScreen.classList.remove("hidden");
  displayRoom.textContent =
    "Room " + room;
  history.pushState(
    {},
    "",
    window.location.pathname +
    "?room=" +
    encodeURIComponent(room)
  );
  startCamera();
}
createCall.addEventListener("click",()=>{
  openCall(generateRoomCode());
});
joinCall.addEventListener("click",()=>{
  const room =
    roomInput.value.trim();
  if(!room){
    roomInput.focus();
    return;
  }
  openCall(room);
});
roomInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    joinCall.click();
  }
});
/* =========================
   CAMERA
========================= */
async function startCamera(){
  try{
    localStream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
      });
    localVideo.srcObject =
      localStream;
    setupAudioProcessing();
  }catch(error){
    console.error(error);
    alert(
      "Please allow camera and microphone access."
    );
  }
}
/* =========================
   AUDIO PROCESSING
========================= */
async function setupAudioProcessing(){
  if(!localStream) return;
  try{
    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    const audioTracks =
      localStream.getAudioTracks();
    if(!audioTracks.length) return;
    const audioOnlyStream =
      new MediaStream(audioTracks);
    sourceNode =
      audioContext.createMediaStreamSource(
        audioOnlyStream
      );
    effectDestination =
      audioContext.createMediaStreamDestination();
    applyVoiceEffect(
      currentVoiceEffect
    );
  }catch(error){
    console.error(
      "Audio processing error:",
      error
    );
  }
}
/* =========================
   VOICE EFFECTS
========================= */
function disconnectAudio(){
  if(!sourceNode) return;
  try{
    sourceNode.disconnect();
  }catch(e){}
}
function applyVoiceEffect(type){
  if(!audioContext ||
     !sourceNode ||
     !effectDestination) return;
  disconnectAudio();
  currentVoiceEffect = type;
  if(audioContext.state==="suspended"){
    audioContext.resume();
  }
  if(type==="normal"){
    sourceNode.connect(
      effectDestination
    );
    return;
  }
  if(type==="deep"){
    const filter =
      audioContext.createBiquadFilter();
    filter.type = "lowshelf";
    filter.frequency.value = 800;
    filter.gain.value = 10;
    sourceNode.connect(filter);
    filter.connect(effectDestination);
    return;
  }
  if(type==="high"){
    const filter =
      audioContext.createBiquadFilter();
    filter.type = "highshelf";
    filter.frequency.value = 1500;
    filter.gain.value = 10;
    sourceNode.connect(filter);
    filter.connect(effectDestination);
    return;
  }
  if(type==="robot"){
    const distortion =
      audioContext.createWaveShaper();
    distortion.curve =
      makeDistortionCurve(120);
    distortion.oversample = "4x";
    sourceNode.connect(distortion);
    distortion.connect(effectDestination);
    return;
  }
  if(type==="echo"){
    const delay =
      audioContext.createDelay(1);
    delay.delayTime.value = .22;
    const feedback =
      audioContext.createGain();
    feedback.gain.value = .28;
    sourceNode.connect(
      effectDestination
    );
    sourceNode.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(
      effectDestination
    );
    return;
  }
  if(type==="radio"){
    const highpass =
      audioContext.createBiquadFilter();
    const lowpass =
      audioContext.createBiquadFilter();
    highpass.type = "highpass";
    highpass.frequency.value = 500;
    lowpass.type = "lowpass";
    lowpass.frequency.value = 3000;
    sourceNode.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(effectDestination);
  }
}
function makeDistortionCurve(amount){
  const samples = 44100;
  const curve =
    new Float32Array(samples);
  const deg =
    Math.PI / 180;
  for(let i=0;i<samples;i++){
    const x =
      i * 2 / samples - 1;
    curve[i] =
      (3 + amount) *
      x * 20 * deg /
      (Math.PI +
      amount * Math.abs(x));
  }
  return curve;
}
document
  .querySelectorAll("[data-voice]")
  .forEach(button=>{
    button.addEventListener("click",()=>{
      document
        .querySelectorAll("[data-voice]")
        .forEach(item=>{
          item.classList.remove(
            "selected"
          );
        });
      button.classList.add(
        "selected"
      );
      applyVoiceEffect(
        button.dataset.voice
      );
    });
  });
/* =========================
   PICTURE EFFECT
========================= */
pictureUpload.addEventListener(
  "change",
  event=>{
    const file =
      event.target.files[0];
    if(!file) return;
    const url =
      URL.createObjectURL(file);
    avatarImage.src = url;
    avatarImage.style.display =
      "block";
    faceList.innerHTML = "";
    const item =
      document.createElement("button");
    item.className =
      "effect-item selected";
    item.textContent =
      "Uploaded Picture";
    faceList.appendChild(item);
  }
);
clearFace.addEventListener(
  "click",
  ()=>{
    avatarImage.style.display =
      "none";
    avatarImage.removeAttribute(
      "src"
    );
    faceList.innerHTML = "";
    pictureUpload.value = "";
  }
);
/* =========================
   AUDIO UPLOAD
========================= */
audioUpload.addEventListener(
  "change",
  event=>{
    const file =
      event.target.files[0];
    if(!file) return;
    const url =
      URL.createObjectURL(file);
    uploadedAudio.src = url;
    uploadedAudio.classList.remove(
      "hidden"
    );
    recordStatus.textContent =
      "Audio loaded.";
  }
);
/* =========================
   RECORD VOICE
========================= */
recordVoice.addEventListener(
  "click",
  async()=>{
    if(
      recorder &&
      recorder.state === "recording"
    ){
      recorder.stop();
      return;
    }
    try{
      const stream =
        await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });
      recordedChunks = [];
      recorder =
        new MediaRecorder(stream);
      recorder.ondataavailable =
        event=>{
          if(event.data.size){
            recordedChunks.push(
              event.data
            );
          }
        };
      recorder.onstop = ()=>{
        const blob =
          new Blob(
            recordedChunks,
            {type:"audio/webm"}
          );
        const url =
          URL.createObjectURL(blob);
        uploadedAudio.src =
          url;
        uploadedAudio.classList.remove(
          "hidden"
        );
        recordStatus.textContent =
          "Recording saved.";
        recordVoice.textContent =
          "Record Voice";
        stream
          .getTracks()
          .forEach(track=>{
            track.stop();
          });
      };
      recorder.start();
      recordVoice.textContent =
        "Stop Recording";
      recordStatus.textContent =
        "Recording...";
    }catch(error){
      recordStatus.textContent =
        "Microphone permission denied.";
    }
  }
);
/* =========================
   MIC
========================= */
micButton.addEventListener(
  "click",
  ()=>{
    if(!localStream) return;
    const tracks =
      localStream.getAudioTracks();
    if(!tracks.length) return;
    tracks[0].enabled =
      !tracks[0].enabled;
    micButton.classList.toggle(
      "active",
      tracks[0].enabled
    );
  }
);
/* =========================
   CAMERA
========================= */
cameraButton.addEventListener(
  "click",
  ()=>{
    if(!localStream) return;
    const tracks =
      localStream.getVideoTracks();
    if(!tracks.length) return;
    tracks[0].enabled =
      !tracks[0].enabled;
    cameraButton.classList.toggle(
      "active",
      tracks[0].enabled
    );
  }
);
/* =========================
   EFFECT PANEL
========================= */
effectsButton.addEventListener(
  "click",
  ()=>{
    effectsPanel.classList.toggle(
      "hidden"
    );
  }
);
/* =========================
   SHARE
========================= */
function callLink(){
  return window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(
      currentRoom
    );
}
document
  .getElementById("copyButton")
  .addEventListener(
    "click",
    async()=>{
      await navigator.clipboard.writeText(
        callLink()
      );
      const button =
        document.getElementById(
          "copyButton"
        );
      button.textContent =
        "Copied";
      setTimeout(()=>{
        button.textContent =
          "Copy";
      },1500);
    }
  );
document
  .getElementById("shareButton")
  .addEventListener(
    "click",
    async()=>{
      const link =
        callLink();
      if(navigator.share){
        try{
          await navigator.share({
            title:"Vid Call",
            text:"Join my video call",
            url:link
          });
        }catch(e){}
      }else{
        await navigator.clipboard
          .writeText(link);
        alert(
          "Call link copied."
        );
      }
    }
  );
/* =========================
   END CALL
========================= */
endCall.addEventListener(
  "click",
  ()=>{
    if(localStream){
      localStream
        .getTracks()
        .forEach(track=>{
          track.stop();
        });
    }
    if(audioContext){
      audioContext.close();
    }
    localStream = null;
    callScreen.classList.add(
      "hidden"
    );
    home.classList.remove(
      "hidden"
    );
    history.pushState(
      {},
      "",
      window.location.pathname
    );
  }
);
/* =========================
   OPEN ROOM FROM URL
========================= */
(function(){
  const params =
    new URLSearchParams(
      window.location.search
    );
  const room =
    params.get("room");
  if(room){
    openCall(room);
  }
})();
</script>
</body>
</html>
