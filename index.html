<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Call App</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

header{
  padding:22px 20px;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  align-items:center
}

h1{margin:0;font-size:28px}

main{
  max-width:520px;
  margin:auto;
  padding:25px 20px 50px
}

.card{
  background:#181818;
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px
}

.avatar{
  width:190px;
  height:190px;
  border-radius:50%;
  display:block;
  margin:10px auto 18px;
  object-fit:cover;
  background:#292929;
  border:5px solid #3b3b3b
}

.name{
  text-align:center;
  font-size:27px;
  font-weight:bold
}

.sub{
  text-align:center;
  color:#999;
  margin-top:6px
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
  font-size:17px;
  font-weight:bold;
  background:#292929;
  color:white
}

.primary{
  background:#4ade80;
  color:#07120a
}

.danger{
  background:#ef4444
}

.row{
  display:flex;
  gap:10px
}

.row button{
  flex:1
}

input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0d0d;
  color:white;
  font-size:18px
}

label{
  display:block;
  color:#aaa;
  margin:12px 0 6px
}

.room{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
  padding:15px;
  background:#0b0b0b;
  border-radius:12px;
  word-break:break-all
}

.notice{
  text-align:center;
  color:#aaa;
  line-height:1.5
}

.hidden{
  display:none
}

#remoteAudio{
  width:100%;
  margin-top:10px
}
</style>
</head>

<body>

<header>
<h1>Call App</h1>
<div id="topStatus">Ready</div>
</header>

<main>

<!-- HOME -->

<section id="home">

<div class="card">

<img id="homeAvatar" class="avatar" alt="Avatar">

<div id="homeName" class="name">
My Avatar
</div>

<div class="sub">
Voice-only calling
</div>

<button id="startBtn" class="primary">
Start Voice Call
</button>

<button id="joinBtn">
Join Voice Call
</button>

</div>


<div class="card">

<h2>Avatar & Profile</h2>

<label>Name</label>

<input
id="nameInput"
placeholder="My Avatar">

<button id="saveName">
Save Name
</button>

<label>Change Avatar</label>

<input
id="avatarInput"
type="file"
accept="image/*">

</div>

</section>


<!-- HOST -->

<section id="host" class="hidden">

<div class="card">

<h2>Your Room</h2>

<p class="notice">
Give this room code to the other person.
</p>

<div id="roomCode" class="room">
Creating...
</div>

<button id="copyCode">
Copy Room Code
</button>

<p id="hostStatus" class="notice">
Waiting for the other person...
</p>

</div>

</section>


<!-- JOIN -->

<section id="join" class="hidden">

<div class="card">

<h2>Join Voice Call</h2>

<label>Enter room code</label>

<input
id="roomInput"
placeholder="Enter room code"
autocomplete="off"
autocapitalize="characters">

<button id="connectBtn" class="primary">
Join Call
</button>

<button id="backBtn">
Back
</button>

</div>

</section>


<!-- CALL -->

<section id="call" class="hidden">

<div class="card">

<img id="callAvatar" class="avatar" alt="Avatar">

<div id="callName" class="name">
My Avatar
</div>

<div id="callStatus" class="sub">
Connecting...
</div>

<div id="timer" class="sub">
00:00
</div>

</div>


<div class="card">

<p class="notice">
🎙️ Voice-only call
<br>
Camera is completely disabled.
</p>

<audio
id="remoteAudio"
autoplay
playsinline
controls>
</audio>

<button
id="soundBtn"
class="primary">

🔊 TURN ON CALL SOUND

</button>

<p
id="audioState"
class="notice">

Audio waiting for activation...

</p>

</div>


<div class="row">

<button id="muteBtn">
🎙️ Mute
</button>

<button id="endBtn" class="danger">
☎️ End Call
</button>

</div>

</section>

</main>


<script>

const $ = id => document.getElementById(id);

let peer = null;
let localStream = null;
let currentCall = null;

let timerInterval = null;
let seconds = 0;


/* DEFAULT AVATAR */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">

<rect width="400" height="400" fill="#292929"/>

<circle
cx="200"
cy="140"
r="70"
fill="#7aa7d9"/>

<path
d="M90 330c10-80 210-80 220 0"
fill="#7aa7d9"/>

</svg>
`);


/* PROFILE */

function getName(){

return localStorage.getItem("call_name")
|| "My Avatar";

}


function getAvatar(){

return localStorage.getItem("call_avatar")
|| DEFAULT_AVATAR;

}


function refreshProfile(){

$("homeAvatar").src =
getAvatar();

$("callAvatar").src =
getAvatar();

$("homeName").textContent =
getName();

$("callName").textContent =
getName();

$("nameInput").value =
getName();

}

refreshProfile();


/* SAVE NAME */

$("saveName").onclick = function(){

let name =
$("nameInput").value.trim();

if(!name){

name = "My Avatar";

}

localStorage.setItem(
"call_name",
name
);

refreshProfile();

};


/* AVATAR */

$("avatarInput").onchange =
function(event){

const file =
event.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(){

localStorage.setItem(
"call_avatar",
reader.result
);

refreshProfile();

};

reader.readAsDataURL(file);

};


/* SCREEN */

function show(section){

[
"home",
"host",
"join",
"call"
].forEach(function(id){

$(id).classList.add("hidden");

});

$(section).classList.remove("hidden");

}


/* MICROPHONE */

async function getMicrophone(){

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Microphone is not supported."
);

}

return await
navigator.mediaDevices.getUserMedia({

audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
},

video:false

});

}


/* TIMER */

function startTimer(){

seconds = 0;

$("timer").textContent =
"00:00";

clearInterval(timerInterval);

timerInterval =
setInterval(function(){

seconds++;

const minutes =
String(
Math.floor(seconds / 60)
).padStart(2,"0");

const secs =
String(
seconds % 60
).padStart(2,"0");

$("timer").textContent =
minutes + ":" + secs;

},1000);

}


function stopTimer(){

clearInterval(
timerInterval
);

timerInterval = null;

}


/* CALL */

function enterCall(call){

currentCall = call;

show("call");

$("topStatus").textContent =
"On call";

$("callStatus").textContent =
"Connecting...";

$("audioState").textContent =
"Waiting for call audio...";

startTimer();


call.on(
"stream",
async function(remoteStream){

const audio =
$("remoteAudio");

audio.srcObject =
remoteStream;

audio.muted = false;

audio.volume = 1.0;


$("callStatus").textContent =
"Connected";

$("audioState").textContent =
"Remote audio connected. Tap the green button if you cannot hear.";


try{

await audio.play();

$("soundBtn").textContent =
"🔊 CALL SOUND IS ON";

$("audioState").textContent =
"Audio is playing.";

}

catch(error){

console.log(
"Autoplay blocked:",
error
);

$("soundBtn").textContent =
"🔊 TURN ON CALL SOUND";

$("audioState").textContent =
"Tap the green button to enable call audio.";

}

});


call.on(
"close",
function(){

$("callStatus").textContent =
"Call ended";

$("audioState").textContent =
"Call audio ended.";

});


call.on(
"error",
function(error){

console.error(error);

$("callStatus").textContent =
"Call error";

$("audioState").textContent =
"There was a call audio error.";

});

}


/* START CALL */

$("startBtn").onclick =
async function(){

try{

$("topStatus").textContent =
"Starting...";


localStream =
await getMicrophone();


localStream
.getAudioTracks()
.forEach(function(track){

track.enabled = true;

});


peer = new Peer();


peer.on(
"open",
function(id){

$("roomCode").textContent =
id;

$("hostStatus").textContent =
"Waiting for the other person to join...";

$("topStatus").textContent =
"Room ready";

show("host");

});


peer.on(
"call",
function(call){

$("hostStatus").textContent =
"Incoming call...";


localStream
.getAudioTracks()
.forEach(function(track){

track.enabled = true;

});


call.answer(
localStream
);

enterCall(call);

});


peer.on(
"error",
function(error){

console.error(error);

alert(
"Connection error: " +
error.message
);

});

}

catch(error){

console.error(error);

alert(
"Please allow microphone access and try again."
);

$("topStatus").textContent =
"Microphone unavailable";

}

};


/* JOIN SCREEN */

$("joinBtn").onclick =
function(){

show("join");

};


$("backBtn").onclick =
function(){

show("home");

};


/* JOIN CALL */

$("connectBtn").onclick =
async function(){

const room =
$("roomInput")
.value
.trim();


if(!room){

alert(
"Enter the room code."
);

return;

}


try{

$("topStatus").textContent =
"Connecting...";


localStream =
await getMicrophone();


localStream
.getAudioTracks()
.forEach(function(track){

track.enabled = true;

});


peer = new Peer();


peer.on(
"open",
function(){

const call =
peer.call(
room,
localStream
);


if(!call){

alert(
"Could not create the call."
);

return;

}


enterCall(call);

});


peer.on(
"error",
function(error){

console.error(error);

alert(
"Could not join the room. Check the room code."
);

$("topStatus").textContent =
"Ready";

});

}

catch(error){

console.error(error);

alert(
"Please allow microphone access and try again."
);

}

};


/* TURN ON CALL SOUND */

$("soundBtn").onclick =
async function(){

const audio =
$("remoteAudio");

audio.muted = false;

audio.volume = 1.0;


try{

await audio.play();

$("soundBtn").textContent =
"🔊 CALL SOUND IS ON";

$("audioState").textContent =
"Audio is playing.";

}

catch(error){

console.error(error);

$("audioState").textContent =
"Audio could not start. Check the phone volume and silent mode.";

}

};


/* COPY ROOM CODE */

$("copyCode").onclick =
async function(){

const code =
$("roomCode").textContent;


try{

await navigator.clipboard.writeText(
code
);

$("copyCode").textContent =
"Copied ✓";


setTimeout(
function(){

$("copyCode").textContent =
"Copy Room Code";

},
1500
);

}

catch(error){

prompt(
"Copy this room code:",
code
);

}

};


/* MUTE */

$("muteBtn").onclick =
function(){

if(!localStream)
return;


const track =
localStream
.getAudioTracks()[0];


if(!track)
return;


track.enabled =
!track.enabled;


$("muteBtn").textContent =
track.enabled
? "🎙️ Mute"
: "🔇 Unmute";

};


/* END CALL */

$("endBtn").onclick =
function(){

if(currentCall){

try{

currentCall.close();

}catch(error){}

}


if(localStream){

localStream
.getTracks()
.forEach(function(track){

track.stop();

});

}


if(peer){

try{

peer.destroy();

}catch(error){}

}


currentCall = null;
localStream = null;
peer = null;


stopTimer();


$("remoteAudio").srcObject =
null;


$("topStatus").textContent =
"Ready";


show("home");

};

</script>

</body>
</html>
