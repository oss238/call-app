<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vid Call</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #050505;
  --panel: #111;
  --panel2: #181818;
  --border: #292929;
  --text: #fff;
  --muted: #999;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* HOME */

#home {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.home-box {
  width: 100%;
  max-width: 430px;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 38px;
}

.home-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px 22px;
}

.home-card h1 {
  font-size: 25px;
  text-align: center;
  margin-bottom: 10px;
}

.home-card p {
  color: var(--muted);
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 25px;
}

.primary,
.secondary {
  width: 100%;
  border-radius: 13px;
  padding: 15px;
  border: 0;
  font-weight: 600;
}

.primary {
  background: #fff;
  color: #000;
}

.secondary {
  background: #202020;
  color: #fff;
  border: 1px solid #303030;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #666;
  margin: 20px 0;
  font-size: 13px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: #292929;
  flex: 1;
}

.room-input {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #333;
  background: #080808;
  color: #fff;
  text-align: center;
  outline: none;
  margin-bottom: 11px;
}

.room-input:focus {
  border-color: #666;
}

/* CALL */

#callScreen {
  min-height: 100vh;
  background: #000;
  position: relative;
}

.call-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(12px);
  z-index: 20;
}

.call-title {
  font-weight: 600;
}

.room-code {
  color: #888;
  font-size: 12px;
  margin-top: 3px;
}

.header-buttons {
  display: flex;
  gap: 8px;
}

.small-button {
  background: #191919;
  color: #fff;
  border: 1px solid #303030;
  border-radius: 10px;
  padding: 9px 12px;
}

.video-area {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 75px 8px 95px;
}

.video-box {
  position: relative;
  min-height: 300px;
  border-radius: 17px;
  overflow: hidden;
  background: #111;
  border: 1px solid #222;
}

video {
  width: 100%;
  height: 100%;
  min-height: 300px;
  object-fit: cover;
  background: #111;
}

.video-name {
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 6px 9px;
  border-radius: 8px;
  background: rgba(0,0,0,.55);
  font-size: 12px;
}

.jautua {
  position: absolute;
  right: 10px;
  bottom: 10px;
  font-size: 8px;
  color: rgba(255,255,255,.55);
  z-index: 5;
}

.call-controls {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 18px;
  background: rgba(20,20,20,.9);
  border: 1px solid #292929;
  backdrop-filter: blur(15px);
  z-index: 30;
}

.control {
  width: 47px;
  height: 47px;
  border-radius: 50%;
  border: 1px solid #333;
  background: #222;
  color: #fff;
  font-size: 18px;
}

.control.active {
  background: #fff;
  color: #000;
}

.end-call {
  background: #b00020;
  border-color: #b00020;
}

/* EFFECTS */

.effects-button {
  position: fixed;
  right: 17px;
  bottom: 90px;
  z-index: 30;
  border: 1px solid #333;
  background: #171717;
  color: #fff;
  border-radius: 12px;
  padding: 11px 14px;
}

.effects-panel {
  position: fixed;
  right: 15px;
  bottom: 145px;
  width: min(350px, calc(100vw - 30px));
  max-height: 65vh;
  overflow-y: auto;
  background: #111;
  border: 1px solid #303030;
  border-radius: 18px;
  padding: 18px;
  z-index: 40;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
}

.effects-panel h2 {
  font-size: 18px;
  margin-bottom: 5px;
}

.effects-panel .description {
  color: #888;
  font-size: 12px;
  line-height: 1.4;
  margin-bottom: 18px;
}

.effect-section {
  border-top: 1px solid #292929;
  padding-top: 15px;
  margin-top: 15px;
}

.effect-section h3 {
  font-size: 14px;
  margin-bottom: 10px;
}

.upload {
  width: 100%;
  padding: 13px;
  border: 1px dashed #444;
  border-radius: 11px;
  background: #181818;
  color: #aaa;
  cursor: pointer;
  text-align: center;
  margin-bottom: 9px;
}

.upload input {
  display: none;
}

.effect-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.effect-item {
  width: 100%;
  text-align: left;
  padding: 11px;
  background: #1a1a1a;
  border: 1px solid #292929;
  color: #fff;
  border-radius: 10px;
}

.effect-item.selected {
  border-color: #fff;
}

.record-button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #202020;
  color: #fff;
}

.status {
  margin-top: 8px;
  font-size: 11px;
  color: #777;
}

/* RESPONSIVE */

@media (min-width: 750px) {
  .video-area {
    grid-template-columns: 1fr 1fr;
  }

  .video-box {
    min-height: calc(100vh - 170px);
  }

  video {
    min-height: calc(100vh - 170px);
  }
}

@media (max-width: 500px) {
  .call-controls {
    bottom: 12px;
  }

  .control {
    width: 43px;
    height: 43px;
  }

  .effects-button {
    bottom: 78px;
  }
}
</style>
</head>
<body>
<!-- HOME -->
<section id="home">
  <div class="home-box">
<div class="logo">Vid Call</div>

<div class="home-card">

  <h1>Start a video call</h1>

  <p>
    Create a room and share the call link with someone.
  </p>

  <button class="primary" id="createCall">
    Create Call
  </button>

  <div class="divider">
    <span>or</span>
  </div>

  <input
    class="room-input"
    id="roomInput"
    placeholder="Enter room code"
    autocomplete="off"
  >

  <button class="secondary" id="joinCall">
    Join Call
  </button>

</div>
  </div>
</section>
<!-- CALL SCREEN -->
<section id="callScreen" class="hidden">
  <header class="call-header">
<div>
  <div class="call-title">Vid Call</div>
  <div class="room-code" id="displayRoom"></div>
</div>

<div class="header-buttons">
  <button class="small-button" id="shareButton">
    Share
  </button>

  <button class="small-button" id="copyButton">
    Copy
  </button>
</div>
  </header>
  <main class="video-area">
<div class="video-box">

  <video id="localVideo" autoplay muted playsinline></video>

  <div class="video-name">
    You
  </div>

  <div class="jautua">
    • Ja?tua
  </div>

</div>


<div class="video-box">

  <video id="remoteVideo" autoplay playsinline></video>

  <div class="video-name">
    Guest
  </div>

  <div class="jautua">
    • Ja?tua
  </div>

</div>
  </main>
  <button class="effects-button" id="effectsButton">
    Effects
  </button>
  <!-- EFFECT PANEL -->
  <aside class="effects-panel hidden" id="effectsPanel">
<h2>Effects</h2>

<p class="description">
  Add and select your permitted video and audio effects.
</p>


<div class="effect-section">

  <h3>Face effects</h3>

  <label class="upload">
    Upload picture
    <input
      type="file"
      id="pictureUpload"
      accept="image/*"
    >
  </label>

  <div class="effect-list" id="faceList"></div>

</div>


<div class="effect-section">

  <h3>Voice effects</h3>

  <label class="upload">
    Upload audio
    <input
      type="file"
      id="audioUpload"
      accept="audio/*"
    >
  </label>

  <button class="record-button" id="recordVoice">
    Record Voice
  </button>

  <div class="status" id="recordStatus">
    No recording
  </div>

  <div class="effect-list" id="voiceList"></div>

</div>
  </aside>
  <!-- CONTROLS -->
  <div class="call-controls">
<button
  class="control active"
  id="micButton"
  title="Microphone"
>
  🎙
</button>

<button
  class="control active"
  id="cameraButton"
  title="Camera"
>
  📹
</button>

<button
  class="control end-call"
  id="endCall"
  title="End call"
>
  ☎
</button>
  </div>
  </section>
<script>
/* ==============================
   BASIC APP
============================== */

const home = document.getElementById("home");
const callScreen = document.getElementById("callScreen");

const createCall = document.getElementById("createCall");
const joinCall = document.getElementById("joinCall");
const roomInput = document.getElementById("roomInput");

const displayRoom = document.getElementById("displayRoom");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const shareButton = document.getElementById("shareButton");
const copyButton = document.getElementById("copyButton");

const micButton = document.getElementById("micButton");
const cameraButton = document.getElementById("cameraButton");
const endCall = document.getElementById("endCall");

const effectsButton = document.getElementById("effectsButton");
const effectsPanel = document.getElementById("effectsPanel");

const pictureUpload = document.getElementById("pictureUpload");
const audioUpload = document.getElementById("audioUpload");

const faceList = document.getElementById("faceList");
const voiceList = document.getElementById("voiceList");

const recordVoice = document.getElementById("recordVoice");
const recordStatus = document.getElementById("recordStatus");

let localStream = null;
let currentRoom = null;
let recorder = null;
let recordedChunks = [];


/* ==============================
   ROOM CODE
============================== */

function createRoomCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

  let code = "";

  for (let i = 0; i < 8; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }

  return code;
}


function openCall(room) {

  currentRoom = room;

  home.classList.add("hidden");
  callScreen.classList.remove("hidden");

  displayRoom.textContent = "Room " + room;

  history.pushState(
    {},
    "",
    window.location.pathname + "?room=" + encodeURIComponent(room)
  );

  startCamera();
}


/* ==============================
   CREATE / JOIN
============================== */

createCall.addEventListener("click", () => {

  const room = createRoomCode();

  openCall(room);

});


joinCall.addEventListener("click", () => {

  const room = roomInput.value.trim();

  if (!room) {
    roomInput.focus();
    return;
  }

  openCall(room);

});


roomInput.addEventListener("keydown", event => {

  if (event.key === "Enter") {
    joinCall.click();
  }

});


/* ==============================
   CAMERA
============================== */

async function startCamera() {

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    localVideo.srcObject = localStream;

  } catch (error) {

    console.error(error);

    alert(
      "Camera and microphone permission is required for the video call."
    );

  }

}


/* ==============================
   MICROPHONE
============================== */

micButton.addEventListener("click", () => {

  if (!localStream) return;

  const audioTracks = localStream.getAudioTracks();

  if (!audioTracks.length) return;

  audioTracks[0].enabled =
    !audioTracks[0].enabled;

  micButton.classList.toggle(
    "active",
    audioTracks[0].enabled
  );

});


/* ==============================
   CAMERA
============================== */

cameraButton.addEventListener("click", () => {

  if (!localStream) return;

  const videoTracks = localStream.getVideoTracks();

  if (!videoTracks.length) return;

  videoTracks[0].enabled =
    !videoTracks[0].enabled;

  cameraButton.classList.toggle(
    "active",
    videoTracks[0].enabled
  );

});


/* ==============================
   END CALL
============================== */

endCall.addEventListener("click", () => {

  if (localStream) {

    localStream.getTracks().forEach(track => {
      track.stop();
    });

  }

  localStream = null;

  callScreen.classList.add("hidden");
  home.classList.remove("hidden");

  history.pushState(
    {},
    "",
    window.location.pathname
  );

});


/* ==============================
   SHARE
============================== */

function getCallLink() {

  return window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(currentRoom);

}


shareButton.addEventListener("click", async () => {

  if (!currentRoom) return;

  const link = getCallLink();

  if (navigator.share) {

    try {

      await navigator.share({
        title: "Vid Call",
        text: "Join my video call",
        url: link
      });

    } catch (error) {}

  } else {

    await navigator.clipboard.writeText(link);

    alert("Call link copied.");

  }

});


copyButton.addEventListener("click", async () => {

  if (!currentRoom) return;

  const link = getCallLink();

  await navigator.clipboard.writeText(link);

  copyButton.textContent = "Copied";

  setTimeout(() => {

    copyButton.textContent = "Copy";

  }, 1500);

});


/* ==============================
   EFFECT PANEL
============================== */

effectsButton.addEventListener("click", () => {

  effectsPanel.classList.toggle("hidden");

});


/* ==============================
   FACE UPLOAD
============================== */

pictureUpload.addEventListener("change", event => {

  const file = event.target.files[0];

  if (!file) return;

  const imageURL = URL.createObjectURL(file);

  const item = document.createElement("button");

  item.className = "effect-item";

  item.textContent = file.name;

  item.addEventListener("click", () => {

    document
      .querySelectorAll("#faceList .effect-item")
      .forEach(button => {
        button.classList.remove("selected");
      });

    item.classList.add("selected");

    /*
      The uploaded image is stored as the
      selected effect.

      A future processing layer can use
      this selection for an approved
      stylized face effect.
    */

    item.dataset.image = imageURL;

  });

  faceList.appendChild(item);

});


/* ==============================
   AUDIO UPLOAD
============================== */

audioUpload.addEventListener("change", event => {

  const file = event.target.files[0];

  if (!file) return;

  const audioURL = URL.createObjectURL(file);

  const item = document.createElement("button");

  item.className = "effect-item";

  item.textContent = file.name;

  item.addEventListener("click", () => {

    document
      .querySelectorAll("#voiceList .effect-item")
      .forEach(button => {
        button.classList.remove("selected");
      });

    item.classList.add("selected");

    item.dataset.audio = audioURL;

  });

  voiceList.appendChild(item);

});


/* ==============================
   RECORD AUDIO
============================== */

recordVoice.addEventListener("click", async () => {

  if (recorder && recorder.state === "recording") {

    recorder.stop();

    recordVoice.textContent = "Record Voice";

    return;

  }

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    recordedChunks = [];

    recorder =
      new MediaRecorder(stream);

    recorder.ondataavailable = event => {

      if (event.data.size > 0) {
        recordedChunks.push(event.data);
      }

    };

    recorder.onstop = () => {

      const blob =
        new Blob(recordedChunks, {
          type: "audio/webm"
        });

      const audioURL =
        URL.createObjectURL(blob);

      const item =
        document.createElement("button");

      item.className = "effect-item";

      item.textContent =
        "Recorded Voice";

      item.addEventListener("click", () => {

        document
          .querySelectorAll("#voiceList .effect-item")
          .forEach(button => {
            button.classList.remove("selected");
          });

        item.classList.add("selected");

        item.dataset.audio =
          audioURL;

      });

      voiceList.appendChild(item);

      stream.getTracks().forEach(track => {
        track.stop();
      });

      recordStatus.textContent =
        "Recording saved.";

    };

    recorder.start();

    recordButtonState();

  } catch (error) {

    recordStatus.textContent =
      "Microphone permission was denied.";

  }

});


function recordButtonState() {

  recordVoice.textContent =
    "Stop Recording";

  recordStatus.textContent =
    "Recording...";

}


/* ==============================
   OPEN ROOM FROM LINK
============================== */

(function checkRoomLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const room =
    params.get("room");

  if (room) {
    openCall(room);
  }

})();
</script>
</body>
</html>
